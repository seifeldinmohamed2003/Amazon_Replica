spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgres:5432/amazondb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin

  data:
    redis:
      host: redis
      port: 6379
      password: redispass
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  expiration: ${JWT_EXPIRATION_MS:86400000}