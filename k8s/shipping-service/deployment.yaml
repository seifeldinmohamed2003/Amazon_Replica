apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: amazon
  labels:
    app: shipping-service
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: shipping-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: shipping-service
    spec:
      containers:
      - env:
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_RABBITMQ_PASSWORD
          value: guest
        - name: JWT_SECRET
          value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://shipping-postgres:5432/amazondb-shipments
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_CASSANDRA_CONTACT_POINTS
          value: cassandra.amazon.svc.cluster.local
        - name: SPRING_CASSANDRA_PORT
          value: '9042'
        - name: SPRING_CASSANDRA_LOCAL_DATACENTER
          value: datacenter1
        - name: SPRING_CASSANDRA_KEYSPACE_NAME
          value: amazonks
        - name: SPRING_CASSANDRA_SCHEMA_ACTION
          value: CREATE_IF_NOT_EXISTS
        - name: SPRING_MONGODB_URI
          value: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
        - name: SPRING_DATA_MONGODB_URI
          value: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: SPRING_DATA_REDIS_PASSWORD
          value: redispass
        - name: SPRING_RABBITMQ_HOST
          value: rabbitmq
        - name: SPRING_RABBITMQ_PORT
          value: '5672'
        - name: SPRING_RABBITMQ_USERNAME
          value: guest
        - name: FEIGN_ORDER_SERVICE_URL
          value: http://order-service:8080
        - name: FEIGN_PRODUCT_SERVICE_URL
          value: http://product-service:8080
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: 'true'
        envFrom:
        - configMapRef:
            name: shipping-service-config
        image: shipping-service:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 10
        name: shipping-service
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        resources: {}
        startupProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
