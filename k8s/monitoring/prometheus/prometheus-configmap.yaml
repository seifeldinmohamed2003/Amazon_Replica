apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    scrape_configs:
      - job_name: user-service
        static_configs:
          - targets: ['user-service.amazon.svc.cluster.local:8080']
        metrics_path: /actuator/prometheus

      - job_name: product-service
        static_configs:
          - targets: ['product-service.amazon.svc.cluster.local:8080']
        metrics_path: /actuator/prometheus

      - job_name: order-service
        static_configs:
          - targets: ['order-service.amazon.svc.cluster.local:8080']
        metrics_path: /actuator/prometheus

      - job_name: shipping-service
        static_configs:
          - targets: ['shipping-service.amazon.svc.cluster.local:8080']
        metrics_path: /actuator/prometheus

      - job_name: billing-service
        static_configs:
          - targets: ['billing-service.amazon.svc.cluster.local:8080']
        metrics_path: /actuator/prometheus
