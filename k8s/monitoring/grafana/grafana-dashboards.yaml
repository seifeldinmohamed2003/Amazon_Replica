              "legendFormat": "Published: {{queue}}"
            },
            {
              "expr": "sum by (queue) (rate(rabbitmq_consumed_total{job=\"shipping-service\"}[5m]))",
              "legendFormat": "Consumed: {{queue}}"
            }
          ],
