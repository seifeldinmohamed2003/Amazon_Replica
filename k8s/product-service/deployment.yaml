apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: amazon
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: product-service-configmap
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_PASSWORD
              value: guest
            - name: SPRING_DATA_REDIS_PASSWORD
              value: redispass
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
                  optional: true