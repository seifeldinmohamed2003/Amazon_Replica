spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://product-postgres:5432/amazondb-products
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
  elasticsearch:
    uris: http://elasticsearch:9200
  data:
    redis:
      host: redis
      port: 6379
      password: redispass
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  expiration: ${JWT_EXPIRATION_MS:86400000}

feign:
  order-service:
    url: ${FEIGN_ORDER_SERVICE_URL:http://order-service:8080}
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://user-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true