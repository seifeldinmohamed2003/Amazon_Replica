spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://order-postgres:5432/amazondb-orders
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin

  data:
    redis:
      host: redis
      port: 6379
      password: redispass
      timeout: 1s
      connect-timeout: 1s

  neo4j:
    uri: bolt://neo4j:7687
    username: neo4j
    password: neo4jpass

  cache:
    type: redis
    redis:
      time-to-live: 300000

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
server:
  port: 8080

feign:
  order-service:
    url: http://order-service:8080
  user-service:
    url: http://user-service:8080
  product-service:
    url: http://product-service:8080
  shipping-service:
    url: http://shipping-service:8080
  billing-service:
    url: http://billing-service:8080

jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  expiration: ${JWT_EXPIRATION_MS:86400000}
feign:
  user-service:
    url: http://user-service:8080
  product-service:
    url: http://product-service:8080
  billing-service:
    url: http://billing-service:8080
  shipping-service:
    url: http://shipping-service:8080
cache:
    type: redis
    redis:
      time-to-live: 300000

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

loki:
  url: http://loki:3100/loki/api/v1/push
