spring:
  application:
    name: shipping-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://shipping-postgres:5432/amazondb-shipments}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: amazonks
    schema-action: CREATE_IF_NOT_EXISTS
  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
  data:
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
    redis:
      host: redis
      port: 6379
      password: redispass
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  expiration: ${JWT_EXPIRATION_MS:86400000}

feign:
  order-service:
    url: ${FEIGN_ORDER_SERVICE_URL:http://order-service:8080}
  product-service:
    url: ${FEIGN_PRODUCT_SERVICE_URL:http://product-service:8080}
