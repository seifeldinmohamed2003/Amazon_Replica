spring.datasource.url=jdbc:postgresql://localhost:5432/amazondb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redispass

spring.mongodb.uri=mongodb://root:rootpass@localhost:27017/amazonmongo?authSource=admin
spring.data.mongodb.uri=mongodb://root:rootpass@localhost:27017/amazonmongo?authSource=admin
