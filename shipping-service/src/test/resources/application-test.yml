spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5432/amazondb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: amazonks
    schema-action: CREATE_IF_NOT_EXISTS
  mongodb:
    uri: mongodb://root:rootpass@localhost:27017/amazonmongo?authSource=admin
  data:
    redis:
      host: localhost
      port: 6379
      password: redispass
server:
  port: 8080
jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  expiration: 86400000